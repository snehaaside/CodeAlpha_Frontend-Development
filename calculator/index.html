<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;600&family=Chivo:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="calc" aria-label="Calculator">
  <div class="screen" aria-live="polite">
    <div class="expr" id="expr">&nbsp;</div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="fn" data-a="clear" data-key="Escape" aria-label="Clear">C</button>
    <button class="fn" data-a="back" data-key="Backspace" aria-label="Backspace">⌫</button>
    <button class="op" data-a="op" data-v="%" data-key="%" aria-label="Remainder">%</button>
    <button class="op" data-a="op" data-v="/" data-key="/" aria-label="Divide">÷</button>

    <button data-a="digit" data-v="7" data-key="7">7</button>
    <button data-a="digit" data-v="8" data-key="8">8</button>
    <button data-a="digit" data-v="9" data-key="9">9</button>
    <button class="op" data-a="op" data-v="*" data-key="*" aria-label="Multiply">×</button>

    <button data-a="digit" data-v="4" data-key="4">4</button>
    <button data-a="digit" data-v="5" data-key="5">5</button>
    <button data-a="digit" data-v="6" data-key="6">6</button>
    <button class="op" data-a="op" data-v="-" data-key="-" aria-label="Subtract">−</button>

    <button data-a="digit" data-v="1" data-key="1">1</button>
    <button data-a="digit" data-v="2" data-key="2">2</button>
    <button data-a="digit" data-v="3" data-key="3">3</button>
    <button class="op" data-a="op" data-v="+" data-key="+" aria-label="Add">+</button>

    <button class="fn" data-a="neg" aria-label="Change sign">±</button>
    <button data-a="digit" data-v="0" data-key="0">0</button>
    <button data-a="dot" data-key="." aria-label="Decimal point">.</button>
    <button class="eq" data-a="eq" data-key="Enter" aria-label="Equals">=</button>
  </div>
</main>
<p class="hint">Keyboard: 0–9, + − * / %, Enter for equals, Backspace to delete, Esc to clear.</p>

<script src="script.js"></script>
</body>
</html>
